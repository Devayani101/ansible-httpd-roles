---
# tasks file for httpd
-  name: install httpd
   ansible.builtin.dnf:
       name: "{{pkg}}"
       state: present
-  name: start and enable
   ansible.builtin.systemd_service:
       name: "{{svc}}"
       state: started
       enabled: true
-  name: deploy app
   ansible.builtin.copy:
       src: index.html
       dest: "{{file_path}}"
